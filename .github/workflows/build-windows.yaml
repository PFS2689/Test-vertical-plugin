name: Build Windows
on:
  workflow_call:
    outputs:
      pluginName:
        description: Plugin name from buildspec
        value: ${{ jobs.windows-build.outputs.pluginName }}
      pluginVersion:
        description: Plugin version from buildspec
        value: ${{ jobs.windows-build.outputs.pluginVersion }}
      commitHash:
        description: Short commit hash
        value: ${{ jobs.windows-build.outputs.commitHash }}

jobs:
  windows-build:
    name: Build Windows x64
    runs-on: windows-2022
    outputs:
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Environment
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT
          "commitHash=$($env:GITHUB_SHA.Substring(0,9))" >> $env:GITHUB_OUTPUT

      - name: Build Plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ github.ref_type == 'tag' && 'Release' || 'RelWithDebInfo' }}

      - name: Package Plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ github.ref_type == 'tag' && 'Release' || 'RelWithDebInfo' }}
          package: 'true'

      - name: Windows Defender scan (Release tags)
        if: github.ref_type == 'tag'
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.setup.outputs.pluginVersion }}'
          $setup = Join-Path $env:GITHUB_WORKSPACE "release\Vertical-Shorts-Plugin-$ver-Setup.exe"
          $zip = Join-Path $env:GITHUB_WORKSPACE "release\Vertical-Shorts-Plugin-$ver.zip"
          $dll = Join-Path $env:GITHUB_WORKSPACE "release\Release\obs-shorts-vertical\bin\64bit\obs-shorts-vertical.dll"
          foreach ($p in @($setup, $zip, $dll)) {
            if (-not (Test-Path $p)) { throw "Missing artifact for Defender scan: $p" }
          }
          $mp = @(
            "${env:ProgramFiles}\Windows Defender\MpCmdRun.exe"
            "${env:ProgramFiles}\Microsoft Defender Antivirus\MpCmdRun.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mp) { throw 'MpCmdRun.exe not found — cannot run Windows Defender scan' }

          # Update signatures when possible; do not disable Defender or add exclusions.
          try { Start-Process -FilePath $mp -ArgumentList @('-SignatureUpdate') -Wait -NoNewWindow } catch { Write-Host 'Signature update skipped/failed; continuing with current defs' }

          foreach ($p in @($setup, $zip, $dll)) {
            Write-Host "Defender scan: $p"
            $proc = Start-Process -FilePath $mp -ArgumentList @('-Scan','-ScanType','3','-File', $p) -Wait -PassThru -NoNewWindow
            # MpCmdRun: 0 = no threats, 2 = threats found
            if ($proc.ExitCode -eq 2) { throw "Windows Defender reported a threat in $p" }
            if ($proc.ExitCode -ne 0) { throw "Windows Defender scan failed for $p (exit $($proc.ExitCode))" }
            Write-Host "Defender CLEAN: $p"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ steps.setup.outputs.commitHash }}
          path: |
            ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.zip
            ${{ github.workspace }}/release/Vertical-Shorts-Plugin-${{ steps.setup.outputs.pluginVersion }}.zip
            ${{ github.workspace }}/release/Vertical-Shorts-Plugin-${{ steps.setup.outputs.pluginVersion }}-Setup.exe
