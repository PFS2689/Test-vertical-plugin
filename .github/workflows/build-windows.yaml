name: Build Windows
on:
  workflow_call:
    outputs:
      pluginName:
        description: Plugin name from buildspec
        value: ${{ jobs.windows-build.outputs.pluginName }}
      pluginVersion:
        description: Plugin version from buildspec
        value: ${{ jobs.windows-build.outputs.pluginVersion }}
      commitHash:
        description: Short commit hash
        value: ${{ jobs.windows-build.outputs.commitHash }}
      signed:
        description: Whether Authenticode signing was applied
        value: ${{ jobs.windows-build.outputs.signed }}

jobs:
  windows-build:
    name: Build Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      signed: ${{ steps.creds.outputs.signed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Environment
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT
          "commitHash=$($env:GITHUB_SHA.Substring(0,9))" >> $env:GITHUB_OUTPUT

      - name: Detect code-signing credentials
        id: creds
        run: |
          $hasAzure = -not [string]::IsNullOrWhiteSpace('${{ secrets.AZURE_CLIENT_ID }}') -and
                      -not [string]::IsNullOrWhiteSpace('${{ secrets.AZURE_TENANT_ID }}') -and
                      -not [string]::IsNullOrWhiteSpace('${{ secrets.AZURE_CLIENT_SECRET }}') -and
                      -not [string]::IsNullOrWhiteSpace('${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}') -and
                      -not [string]::IsNullOrWhiteSpace('${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}') -and
                      -not [string]::IsNullOrWhiteSpace('${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}')
          $hasPfx = -not [string]::IsNullOrWhiteSpace('${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}') -and
                    -not [string]::IsNullOrWhiteSpace('${{ secrets.WINDOWS_CODESIGN_PASSWORD }}')
          "has_azure=$([bool]$hasAzure)" >> $env:GITHUB_OUTPUT
          "has_pfx=$([bool]$hasPfx)" >> $env:GITHUB_OUTPUT
          "signed=$([bool]($hasAzure -or $hasPfx))" >> $env:GITHUB_OUTPUT
          if ($hasAzure) { Write-Host 'Signing mode: Azure Artifact Signing' }
          elseif ($hasPfx) { Write-Host 'Signing mode: PFX / signtool' }
          else { Write-Host 'Signing mode: none' }

      - name: Authenticode credentials check (Release tags)
        if: github.ref_type == 'tag'
        run: |
          if ('${{ steps.creds.outputs.signed }}' -ne 'true') {
            Write-Warning @"
          Authenticode signing credentials are not configured.
          This tag release will ship UNSIGNED so the OBS load-path / OBS 32.2.1 fix can publish.
          Add Azure Artifact Signing secrets or WINDOWS_CODESIGN_PFX_BASE64 + WINDOWS_CODESIGN_PASSWORD
          (see docs/SIGNING-WINDOWS.md) and re-tag to publish signed builds.
          "@
          }

      - name: Build Plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ github.ref_type == 'tag' && 'Release' || 'RelWithDebInfo' }}

      - name: Sign plugin DLL (Azure Artifact Signing)
        if: github.ref_type == 'tag' && steps.creds.outputs.has_azure == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\release\Release\obs-shorts-vertical\bin\64bit\obs-shorts-vertical.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Vertical Shorts Plugin
          description-url: https://github.com/PFS2689/verticalshorts

      - name: Sign plugin DLL (PFX)
        if: github.ref_type == 'tag' && steps.creds.outputs.has_azure != 'true' && steps.creds.outputs.has_pfx == 'true'
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          .\.github\scripts\Sign-Windows.ps1 -Required -Path @(
            "$env:GITHUB_WORKSPACE\release\Release\obs-shorts-vertical\bin\64bit\obs-shorts-vertical.dll"
          )

      - name: Package Plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ github.ref_type == 'tag' && 'Release' || 'RelWithDebInfo' }}
          package: 'true'

      - name: Sign Setup.exe (Azure Artifact Signing)
        if: github.ref_type == 'tag' && steps.creds.outputs.has_azure == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\release\Vertical-Shorts-Plugin-${{ steps.setup.outputs.pluginVersion }}-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Vertical Shorts Plugin
          description-url: https://github.com/PFS2689/verticalshorts

      - name: Sign Setup.exe (PFX)
        if: github.ref_type == 'tag' && steps.creds.outputs.has_azure != 'true' && steps.creds.outputs.has_pfx == 'true'
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $ver = '${{ steps.setup.outputs.pluginVersion }}'
          .\.github\scripts\Sign-Windows.ps1 -Required -Path @(
            "$env:GITHUB_WORKSPACE\release\Vertical-Shorts-Plugin-$ver-Setup.exe"
          )

      - name: Verify Authenticode signatures
        if: github.ref_type == 'tag' && steps.creds.outputs.signed == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.setup.outputs.pluginVersion }}'
          $files = @(
            "$env:GITHUB_WORKSPACE\release\Release\obs-shorts-vertical\bin\64bit\obs-shorts-vertical.dll"
            "$env:GITHUB_WORKSPACE\release\Vertical-Shorts-Plugin-$ver-Setup.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing file for signature check: $f" }
            $sig = Get-AuthenticodeSignature -FilePath $f
            Write-Host "$f => $($sig.Status) | $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature not Valid for $f : $($sig.Status) $($sig.StatusMessage)"
            }
          }
          Write-Host 'Authenticode verification passed for DLL and Setup.exe'

      - name: Audit OBS module exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = if ('${{ github.ref_type }}' -eq 'tag') { 'Release' } else { 'RelWithDebInfo' }
          $dll = Join-Path $env:GITHUB_WORKSPACE "release\$config\obs-shorts-vertical\bin\64bit\obs-shorts-vertical.dll"
          if (-not (Test-Path $dll)) { throw "Missing plugin DLL for export audit: $dll" }
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find '**/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $exports = & $dumpbin /EXPORTS $dll | Out-String
          Write-Host $exports
          foreach ($sym in @(
            'obs_module_load',
            'obs_module_unload',
            'obs_module_post_load',
            'obs_module_ver',
            'obs_module_set_pointer',
            'obs_module_name',
            'obs_module_description',
            'obs_module_author'
          )) {
            if ($exports -notmatch [regex]::Escape($sym)) {
              throw "Required OBS module export missing: $sym"
            }
          }
          Write-Host 'OBS module export audit passed'

      - name: Audit release package layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = if ('${{ github.ref_type }}' -eq 'tag') { 'Release' } else { 'RelWithDebInfo' }
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release\$config"
          $root = Join-Path $releaseDir 'obs-shorts-vertical'
          $required = @(
            (Join-Path $root 'bin\64bit\obs-shorts-vertical.dll'),
            (Join-Path $root 'data\locale\en-US.ini'),
            (Join-Path $releaseDir 'INSTALL.txt')
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Missing required package file: $p" }
            Write-Host "OK $p"
          }
          # Also place INSTALL.txt inside the plugin folder for zip installs
          Copy-Item -Force (Join-Path $releaseDir 'INSTALL.txt') (Join-Path $root 'INSTALL.txt')
          Write-Host "OK $(Join-Path $root 'INSTALL.txt')"
          # OBS third-party layout must not ship nested Qt/OBS runtime DLLs
          $unexpected = Get-ChildItem -Recurse $root -File | Where-Object {
            $_.Extension -match '\.(exe|bat|cmd|ps1)$' -or
            $_.Name -match '^(Qt6|obs\.dll|obs-frontend-api)'
          }
          if ($unexpected) {
            $unexpected | ForEach-Object { Write-Host "UNEXPECTED: $($_.FullName)" }
            throw 'Unexpected executables or runtime DLLs in plugin package'
          }
          Write-Host 'Package layout audit passed'

      - name: Windows Defender scan (Release tags)
        if: github.ref_type == 'tag'
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.setup.outputs.pluginVersion }}'
          $setup = Join-Path $env:GITHUB_WORKSPACE "release\Vertical-Shorts-Plugin-$ver-Setup.exe"
          $zip = Join-Path $env:GITHUB_WORKSPACE "release\Vertical-Shorts-Plugin-$ver.zip"
          $dll = Join-Path $env:GITHUB_WORKSPACE "release\Release\obs-shorts-vertical\bin\64bit\obs-shorts-vertical.dll"
          foreach ($p in @($setup, $zip, $dll)) {
            if (-not (Test-Path $p)) { throw "Missing artifact for Defender scan: $p" }
          }
          $mp = @(
            "${env:ProgramFiles}\Windows Defender\MpCmdRun.exe"
            "${env:ProgramFiles}\Microsoft Defender Antivirus\MpCmdRun.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mp) { throw 'MpCmdRun.exe not found — cannot run Windows Defender scan' }

          # Update signatures when possible; do not disable Defender or add exclusions.
          try { Start-Process -FilePath $mp -ArgumentList @('-SignatureUpdate') -Wait -NoNewWindow } catch { Write-Host 'Signature update skipped/failed; continuing with current defs' }

          foreach ($p in @($setup, $zip, $dll)) {
            Write-Host "Defender scan: $p"
            $proc = Start-Process -FilePath $mp -ArgumentList @('-Scan','-ScanType','3','-File', $p) -Wait -PassThru -NoNewWindow
            # MpCmdRun: 0 = no threats, 2 = threats found
            if ($proc.ExitCode -eq 2) { throw "Windows Defender reported a threat in $p" }
            if ($proc.ExitCode -ne 0) { throw "Windows Defender scan failed for $p (exit $($proc.ExitCode))" }
            Write-Host "Defender CLEAN: $p"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ steps.setup.outputs.commitHash }}
          path: |
            ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.zip
            ${{ github.workspace }}/release/Vertical-Shorts-Plugin-${{ steps.setup.outputs.pluginVersion }}.zip
            ${{ github.workspace }}/release/Vertical-Shorts-Plugin-${{ steps.setup.outputs.pluginVersion }}-Setup.exe
